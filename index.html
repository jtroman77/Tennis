<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roman Tennis Scanner V6.2</title>
<style>
:root{--bg:#0e1117;--card:#171b24;--line:#2b3240;--txt:#f4f7fb;--muted:#9aa6b6;--blue:#3b82f6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:920px;margin:auto;padding:14px}
h1{font-size:22px;margin:0 0 4px}.sub,.small{color:var(--muted);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:680px){.grid{grid-template-columns:1fr}}
label{font-size:12px;color:var(--muted);display:block;margin:0 0 5px}input,select,button{width:100%;font-size:16px;border-radius:10px;border:1px solid var(--line);padding:11px}
input,select{background:#10141b;color:var(--txt)}button{border:0;background:var(--blue);color:#fff;font-weight:800}.status{margin-top:9px;font-size:13px;color:var(--muted)}
.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.match{border-top:1px solid var(--line);padding:13px 0}.match:first-child{border-top:0}
.name{font-weight:850}.meta{color:var(--muted);font-size:12px;line-height:1.55}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row button{width:auto;padding:8px 10px;font-size:13px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900;margin-bottom:7px}.badge.qualifier{background:rgba(34,197,94,.14);color:#64e48b;border:1px solid rgba(34,197,94,.35)}.badge.watch{background:rgba(245,158,11,.14);color:#f8bd55;border:1px solid rgba(245,158,11,.35)}.badge.skip{background:rgba(239,68,68,.14);color:#ff7c7c;border:1px solid rgba(239,68,68,.35)}
.result{font-size:20px;font-weight:900;margin:10px 0}.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:650px){.players{grid-template-columns:1fr}}
.player{background:#11161e;border:1px solid var(--line);border-radius:13px;padding:12px}.identity{display:flex;gap:12px;align-items:center}.avatar{width:78px;height:78px;border-radius:50%;object-fit:cover;background:#242b36;border:1px solid var(--line)}
.pname{font-size:18px;font-weight:850}.pid{font-size:11px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.stat{background:#171d27;border:1px solid var(--line);border-radius:9px;padding:8px}.stat b{display:block;font-size:15px}.stat span{font-size:10px;color:var(--muted)}
.cross{display:inline-block;margin-top:10px;color:#8ab4ff;text-decoration:none;font-size:12px}
</style></head>
<body><div class="wrap">
<h1>Roman Tennis Scanner V6.2</h1>
<div class="sub">Always shows the best upcoming matches • QUALIFIER / WATCH / SKIP • Sofascore verification</div>
<div class="card"><div class="grid">
<div><label>LiveTennisAPI key</label><input id="key" type="password" placeholder="Paste API key manually"></div>
<div><label>Window</label><select id="hours"><option>1</option><option selected>2</option><option>3</option></select></div>
<div><label>Requests per scan</label><select id="pages"><option value="1" selected>1 request</option><option value="2">2 requests</option></select></div>
<div><label>Minimum qualifier baseline</label><select id="min"><option selected>65</option><option>70</option><option>75</option></select></div>
</div><button id="scan" style="margin-top:10px">SCAN NOW</button><div id="status" class="status"></div></div>
<div id="matches" class="card"><div class="small">No scan yet.</div></div>
<div id="analysis" class="card" style="display:none"></div>
</div>
<script>
(()=>{
const API='https://api.livetennisapi.com/api/public/v1/matches';
const WORKER='https://tennis.jamestromen.workers.dev';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let matches=[];
function wat(iso){return new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Lagos',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso))}
function watDate(iso){return new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Lagos',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(iso))}
function baseline(m){const a=+m.players?.p1?.ranking,b=+m.players?.p2?.ranking;if(!(a>0&&b>0))return 50;return Math.min(78,52+8*Math.log2(Math.max(a,b)/Math.min(a,b)))}
function statusFor(base,min){
  if(base>=min) return {label:'QUALIFIER',cls:'qualifier'};
  if(base>=min-8) return {label:'WATCH',cls:'watch'};
  return {label:'SKIP',cls:'skip'};
}
async function page(key,offset){
  const u=new URL(API);u.searchParams.set('status','upcoming');u.searchParams.set('limit','100');u.searchParams.set('offset',offset);
  const r=await fetch(u,{headers:{Authorization:'Bearer '+key,'X-API-Key':key,Accept:'application/json'}});
  if(!r.ok)throw Error('API '+r.status);return r.json()
}
function render(){
  const b=$('matches'),min=+$('min').value;
  if(!matches.length){b.innerHTML='<div class="small">No upcoming singles found inside this time window.</div>';return}
  b.innerHTML=matches.map((x,i)=>{
    const m=x.m,p1=m.players?.p1||{},p2=m.players?.p2||{},s=statusFor(x.base,min);
    return `<div class="match"><span class="badge ${s.cls}">${s.label}</span><div class="name">${esc(p1.name)} vs ${esc(p2.name)}</div><div class="meta">${wat(m.scheduled_time)} WAT • ${esc(m.tournament||'')} • ${esc(m.surface||'?')}<br>Rank ${p1.ranking??'NR'} vs ${p2.ranking??'NR'} • baseline ${Math.round(x.base)}/100</div><div class="row"><button class="auto" data-i="${i}">AUTO COMPARE + VERIFY</button></div></div>`
  }).join('');
  b.querySelectorAll('.auto').forEach(x=>x.addEventListener('click',()=>compare(+x.dataset.i)))
}
function pct(v){return v==null?'N/A':Math.round(v)+'%'}
function playerCard(p,label){
  return `<div class="player"><div class="identity"><img class="avatar" src="${esc(p.image)}" alt="${esc(p.name)}" onerror="this.style.visibility='hidden'"><div><div class="small">${label}</div><div class="pname">${esc(p.name)}</div><div class="pid">Sofascore ID ${esc(p.id)}${p.country?' • '+esc(p.country):''}</div></div></div><div class="stats"><div class="stat"><b>${p.ranking??'NR'}</b><span>Ranking</span></div><div class="stat"><b>${p.score}</b><span>Arithmetic score</span></div><div class="stat"><b>${p.surfaceWins}-${p.surfaceLosses}</b><span>Current surface (${p.surfaceMatches})</span></div><div class="stat"><b>${pct(p.surfaceWinPct)}</b><span>Surface win rate</span></div><div class="stat"><b>${p.recentWins}-${p.recentLosses}</b><span>Last ${p.recentMatches} overall</span></div><div class="stat"><b>${pct(p.recentWinPct)}</b><span>Recent win rate</span></div></div><a class="cross" href="${esc(p.sofascoreProfile)}" target="_blank" rel="noopener">Open this exact Sofascore player ↗</a></div>`
}
async function compare(i){
  const m=matches[i].m,p1=m.players?.p1||{},p2=m.players?.p2||{},box=$('analysis');
  box.style.display='block';box.innerHTML=`<div class="status">Finding and verifying ${esc(p1.name)} vs ${esc(p2.name)}…</div>`;box.scrollIntoView({behavior:'smooth'});
  try{
    const u=new URL(WORKER+'/compare');u.searchParams.set('player1',p1.name);u.searchParams.set('player2',p2.name);u.searchParams.set('surface',m.surface||'hard');u.searchParams.set('date',watDate(m.scheduled_time));
    const r=await fetch(u);const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||('Worker '+r.status));
    const a=d.resolved.player1,b=d.resolved.player2;
    box.innerHTML=`<div class="small">Requested: ${esc(d.requested.player1)} vs ${esc(d.requested.player2)} • ${esc(d.requested.surface)} • ${esc(d.requested.date||'')}</div><div class="result">${esc(d.winner)} — ${esc(d.market)}</div><div class="small">Arithmetic edge ${d.edge}. Cross-check the returned names, photos and Sofascore IDs below before using the result.</div><div class="players" style="margin-top:12px">${playerCard(a,'Resolved Player 1')}${playerCard(b,'Resolved Player 2')}</div>`
  }catch(e){
    box.innerHTML=`<div class="bad">Auto comparison failed: ${esc(e.message)}</div><div class="small">Check that the V6.1 worker.js is deployed in Cloudflare.</div>`
  }
}
$('scan').addEventListener('click',async()=>{
  const key=$('key').value.trim();if(!key){$('status').innerHTML='<span class="bad">Paste API key.</span>';return}
  $('scan').disabled=true;$('status').textContent='Scanning…';
  try{
    let all=[];for(let i=0;i<+$('pages').value;i++){const d=await page(key,i*100);all.push(...(d.data||[]));if(!d.meta?.has_more)break}
    const now=Date.now(),end=now+(+$('hours').value)*3600000,min=+$('min').value;
    const upcoming=all.filter(m=>{const t=Date.parse(m.scheduled_time);return t>now&&t<=end&&m.status==='upcoming'&&!m.is_doubles&&m.draw!=='doubles'})
      .map(m=>({m,base:baseline(m)}))
      .sort((a,b)=>b.base-a.base || Date.parse(a.m.scheduled_time)-Date.parse(b.m.scheduled_time));
    matches=upcoming.slice(0,10);
    render();
    const q=matches.filter(x=>x.base>=min).length,w=matches.filter(x=>x.base<min&&x.base>=min-8).length;
    $('status').innerHTML=`<span class="good">Done.</span> ${all.length} loaded • showing best ${matches.length}. ${q} qualifier${q===1?'':'s'} • ${w} watch.`;
  }catch(e){$('status').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}
  finally{$('scan').disabled=false}
})
})();
</script></body></html>
