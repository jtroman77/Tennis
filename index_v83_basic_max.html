<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roman Tennis Scanner V8.3 Basic Max</title>
<style>
:root{--bg:#0e1117;--card:#171b24;--line:#2b3240;--txt:#f4f7fb;--muted:#9aa6b6;--blue:#3b82f6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:auto;padding:14px}h1{font-size:22px;margin:0 0 4px}.sub,.small{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:680px){.grid{grid-template-columns:1fr}}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}input,select,button{width:100%;font-size:16px;border-radius:10px;border:1px solid var(--line);padding:11px}
input,select{background:#10141b;color:var(--txt)}button{border:0;background:var(--blue);color:#fff;font-weight:800}button:disabled{opacity:.55}
.status{margin-top:9px;font-size:13px;color:var(--muted)}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.match{border-top:1px solid var(--line);padding:13px 0}.match:first-child{border-top:0}.name{font-weight:850}.meta{color:var(--muted);font-size:12px;line-height:1.55}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row button{width:auto;padding:8px 10px;font-size:13px}
.badge{display:inline-block;font-size:11px;font-weight:900;margin-bottom:6px}.qualifier{color:#64e48b}.watch{color:#f8bd55}.skip{color:#ff7c7c}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.panel{background:#11161e;border:1px solid var(--line);border-radius:13px;padding:12px}.section-title{font-size:16px;font-weight:900}
.result{font-size:20px;font-weight:900;margin:8px 0}.bigprob{font-size:30px;font-weight:900}.fair{font-size:18px;font-weight:900;margin-top:6px}.fair span{color:var(--green)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.stat{background:#171d27;border:1px solid var(--line);border-radius:9px;padding:8px}.stat b{display:block}.stat span{font-size:10px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}td,th{padding:7px;border-bottom:1px solid var(--line);text-align:left}
.notice{margin-top:10px;padding:9px;border-radius:9px;background:#10141b;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<div class="wrap">
<h1>Roman Tennis Scanner V8.3 — Basic Max</h1>
<div class="sub">Moneyline + Win At Least One Set • uses BASIC history, H2H, archive career and serve aggregates • efficient request use</div>

<div class="card">
  <div class="grid">
    <div><label>LiveTennisAPI Basic key</label><input id="key" type="password" placeholder="Paste Basic API key"></div>
    <div><label>Window</label><select id="hours"><option>1</option><option selected>2</option><option>3</option></select></div>
    <div><label>Requests per scan</label><select id="pages"><option value="1" selected>1 request</option><option value="2">2 requests</option></select></div>
    <div><label>Shortlist baseline</label><select id="min"><option selected>65</option><option>70</option><option>75</option></select></div>
  </div>
  <button id="scan" style="margin-top:10px">SCAN NOW</button>
  <div id="status" class="status"></div>
</div>

<div id="matches" class="card"><div class="small">No scan yet.</div></div>
<div id="analysis" class="card" style="display:none"></div>
</div>

<script>
(()=>{
const API='https://api.livetennisapi.com/api/public/v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const num=v=>{const x=Number(v);return Number.isFinite(x)?x:null};
const norm=s=>String(s||'').trim().toLowerCase();
let matches=[];

function headers(){const key=$('key').value.trim();return {'X-API-Key':key,'Authorization':'Bearer '+key,'Accept':'application/json'}}
async function api(path,soft=false){
  try{
    const r=await fetch(API+path,{headers:headers()});
    let d={};try{d=await r.json()}catch{}
    if(!r.ok)throw Error(String(d?.detail||d?.message||d?.error||('API '+r.status)));
    return d
  }catch(e){
    if(soft)return null;
    throw e
  }
}
function wat(iso){return new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Lagos',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso))}
function matchPlayers(m){const p=m?.players||{};return{p1:p.p1||p.player1||{},p2:p.p2||p.player2||{}}}
function baseline(m){
  const {p1,p2}=matchPlayers(m),a=+p1.ranking,b=+p2.ranking;
  if(!(a>0&&b>0))return 50;
  return Math.min(80,52+8*Math.log2(Math.max(a,b)/Math.min(a,b)))
}
function tag(base,min){if(base>=min)return['QUALIFIER','qualifier'];if(base>=min-8)return['WATCH','watch'];return['SKIP','skip']}
function sameId(a,b){return a!=null&&b!=null&&String(a)===String(b)}
function winnerForPlayer(m,playerId){
  const w=num(m?.winner);if(w!==1&&w!==2)return null;
  const {p1,p2}=matchPlayers(m);
  if(sameId(p1.id,playerId))return w===1;
  if(sameId(p2.id,playerId))return w===2;
  return null
}
function matchDate(m){return m?.live_at||m?.scheduled_time||m?.event_date||m?.date||null}
function daysBetween(a,b){const A=Date.parse(a||''),B=Date.parse(b||'');return Number.isFinite(A)&&Number.isFinite(B)?(B-A)/86400000:null}
function scoreSets(m){
  const candidates=[m?.score?.sets,m?.sets,m?.score?.set_score,m?.set_score];
  for(const s of candidates){
    if(Array.isArray(s)&&s.length>=2){
      const a=num(s[0]),b=num(s[1]);if(a!=null&&b!=null&&a>=0&&b>=0&&a+b>=2)return a+b
    }
  }
  const g=m?.score?.games||m?.games;
  if(Array.isArray(g)&&Array.isArray(g[0])&&Array.isArray(g[1])){
    const len=Math.max(g[0].length,g[1].length);if(len>=2&&len<=5)return len
  }
  if(typeof m?.score==='string'){
    const parts=m.score.split(/\s+/).filter(x=>/\d/.test(x)&&!/(RET|W\/O|DEF)/i.test(x));
    if(parts.length>=2&&parts.length<=5)return parts.length
  }
  return null
}
function isBO3(m){if(m?.format==='BO3')return true;if(m?.format==='BO5')return false;const sc=scoreSets(m);return sc!=null&&sc<=3}
function shrinkPct(wins,total,target=10){if(!total)return null;const raw=wins/total,k=Math.min(1,total/target);return 0.5+(raw-0.5)*k}
function tookSet(m,playerId){
  if(!isBO3(m))return null;
  const win=winnerForPlayer(m,playerId),sets=scoreSets(m);
  if(win===null||sets==null)return null;
  if(win)return true;
  return sets===3
}
function historySummary(rows,playerId,surface,upcomingTime){
  const valid=[];
  for(const m of rows||[]){
    const win=winnerForPlayer(m,playerId);if(win===null)continue;
    valid.push({...m,_win:win,_took:tookSet(m,playerId)})
  }
  const recent=valid.slice(0,10),rw=recent.filter(x=>x._win).length;
  const recentP=shrinkPct(rw,recent.length,10);

  const surf=valid.filter(x=>surface&&norm(x.surface)===norm(surface)).slice(0,20),sw=surf.filter(x=>x._win).length;
  const surfaceP=shrinkPct(sw,surf.length,12);

  const recentSet=recent.filter(x=>x._took!==null),rst=recentSet.filter(x=>x._took).length;
  const recentSetP=shrinkPct(rst,recentSet.length,10);
  const surfSet=surf.filter(x=>x._took!==null),sst=surfSet.filter(x=>x._took).length;
  const surfaceSetP=shrinkPct(sst,surfSet.length,12);

  let last3=0,last7=0;
  for(const m of valid.slice(0,20)){
    const d=daysBetween(matchDate(m),upcomingTime);
    if(d!=null&&d>=0){if(d<=3)last3++;if(d<=7)last7++}
  }
  const freshness=clamp(1-0.08*last7-0.10*last3,0.25,1);

  return {
    recent:{wins:rw,losses:recent.length-rw,n:recent.length,p:recentP},
    surface:{wins:sw,losses:surf.length-sw,n:surf.length,p:surfaceP},
    setRecent:{yes:rst,no:recentSet.length-rst,n:recentSet.length,p:recentSetP},
    setSurface:{yes:sst,no:surfSet.length-sst,n:surfSet.length,p:surfaceSetP},
    workload:{last3,last7,freshness}
  }
}
function deepFind(obj,keys){
  const wanted=keys.map(x=>x.toLowerCase()),seen=new Set(),stack=[obj];
  while(stack.length){
    const x=stack.pop();
    if(!x||typeof x!=='object'||seen.has(x))continue;seen.add(x);
    for(const[k,v]of Object.entries(x)){
      if(wanted.includes(k.toLowerCase())){const z=num(v);if(z!=null)return z}
      if(v&&typeof v==='object')stack.push(v)
    }
  }
  return null
}
function archiveSurfacePct(career,surface){
  if(!career)return null;
  const r=career.record||career.data?.record||career;
  const names=norm(surface).includes('clay')?['clay']:norm(surface).includes('grass')?['grass']:['hard','hardcourt'];
  let block=null;
  for(const k of names){if(r?.by_surface?.[k])block=r.by_surface[k];if(r?.surface?.[k])block=r.surface[k]}
  if(!block){
    const all=Object.entries(r?.by_surface||r?.surface||{});
    const hit=all.find(([k])=>names.some(n=>norm(k).includes(n)));if(hit)block=hit[1]
  }
  if(!block)return null;
  const w=deepFind(block,['wins','w']),l=deepFind(block,['losses','l']);
  if(w==null||l==null||w+l<=0)return null;
  return w/(w+l)
}
function serveQuality(career){
  if(!career)return null;
  const s=career.serve||career.data?.serve||{};
  const fsw=deepFind(s,['first_serve_points_won_pct','first_serve_won_pct','first_serve_points_won_ratio','first_serve_points_won']);
  const ssw=deepFind(s,['second_serve_points_won_pct','second_serve_won_pct','second_serve_points_won_ratio','second_serve_points_won']);
  const ace=deepFind(s,['ace_rate','aces_per_service_point','ace_pct']);
  const df=deepFind(s,['double_fault_rate','double_faults_per_service_point','double_fault_pct']);
  const hold=deepFind(s,['hold_pct','service_games_won_pct','hold_rate']);
  let vals=[],weights=[];
  const normPct=v=>v==null?null:(v>1?v/100:v);
  if(fsw!=null){vals.push(normPct(fsw));weights.push(35)}
  if(ssw!=null){vals.push(normPct(ssw));weights.push(30)}
  if(hold!=null){vals.push(normPct(hold));weights.push(25)}
  if(ace!=null){vals.push(clamp(0.5+normPct(ace)*1.5,0.45,0.75));weights.push(5)}
  if(df!=null){vals.push(clamp(0.65-normPct(df),0.35,0.70));weights.push(5)}
  if(!vals.length)return null;
  let a=0,w=0;vals.forEach((v,i)=>{a+=v*weights[i];w+=weights[i]});return clamp(a/w,0.25,0.85)
}
function rankProb(r1,r2){
  r1=num(r1);r2=num(r2);if(!(r1>0&&r2>0))return null;
  const z=1.20*Math.log(r2/r1);return clamp(1/(1+Math.exp(-z)),0.18,0.82)
}
function relativeProb(a,b){if(a==null||b==null)return null;const den=a+b;return den>0?clamp(a/den,0.15,0.85):null}
function h2hInfo(d,currentSurface){
  const meetings=Array.isArray(d?.meetings)?d.meetings:(Array.isArray(d?.data)?d.data:[]);
  const clean=meetings.filter(x=>!x?.outcome||x.outcome==='completed');
  let p1=0,p2=0;for(const m of clean){if(m.winner===1)p1++;else if(m.winner===2)p2++}
  const total=p1+p2;let p=total?p1/total:null;if(p!=null){const k=Math.min(1,total/5);p=0.5+(p-0.5)*k}
  const surf=clean.filter(x=>norm(x.surface)===norm(currentSurface));
  let s1=0,s2=0;for(const m of surf){if(m.winner===1)s1++;else if(m.winner===2)s2++}
  const st=s1+s2;let sp=st?s1/st:null;if(sp!=null){const k=Math.min(1,st/4);sp=0.5+(sp-0.5)*k}
  return{p1Wins:p1,p2Wins:p2,n:total,p1Prob:p,surfaceP1Prob:sp,surfaceN:st}
}
function fatigueProb(a,b){if(a==null||b==null)return null;return clamp(a/(a+b),0.25,0.75)}
function weighted(parts){
  let w=0,s=0;for(const p of parts){if(p.p==null)continue;w+=p.w;s+=p.w*p.p}
  return{p:w?s/w:null,coverage:w}
}
function analyzeMoneyline(m,s1,s2,h2h,c1,c2){
  const {p1,p2}=matchPlayers(m);
  const aSurf=archiveSurfacePct(c1,m.surface),bSurf=archiveSurfacePct(c2,m.surface);
  const aServe=serveQuality(c1),bServe=serveQuality(c2);
  const parts=[
    {name:'Recent surface',w:30,p:relativeProb(s1.surface.p,s2.surface.p)},
    {name:'Recent overall',w:20,p:relativeProb(s1.recent.p,s2.recent.p)},
    {name:'Career surface',w:10,p:relativeProb(aSurf,bSurf)},
    {name:'Serve quality',w:15,p:relativeProb(aServe,bServe)},
    {name:'Ranking',w:10,p:rankProb(p1.ranking,p2.ranking)},
    {name:'H2H',w:10,p:h2h.surfaceN>=2?h2h.surfaceP1Prob:h2h.p1Prob},
    {name:'Freshness',w:5,p:fatigueProb(s1.workload.freshness,s2.workload.freshness)}
  ];
  const model=weighted(parts),p1prob=model.p;
  if(p1prob==null)return{winner:null,prob:null,coverage:0,classification:'SKIP',p1Probability:null,parts};
  const side=p1prob>=0.5?1:2,prob=side===1?p1prob:1-p1prob;
  let classification='SKIP';
  if(model.coverage>=75&&prob>=0.76)classification='STRONG';
  else if(model.coverage>=60&&prob>=0.68)classification='PLAY';
  else if(prob>=0.62)classification='WATCH';
  return{winner:side===1?p1.name:p2.name,winnerSide:side,prob,coverage:model.coverage,classification,p1Probability:p1prob,parts,aSurf,bSurf,aServe,bServe}
}
function setProbFromMatchProb(q){
  if(q==null)return null;
  let lo=.001,hi=.999;
  for(let i=0;i<50;i++){const p=(lo+hi)/2,match=3*p*p-2*p*p*p;if(match<q)lo=p;else hi=p}
  const p=(lo+hi)/2;return clamp(1-(1-p)*(1-p),.05,.99)
}
function analyzeOneSet(m,s1,s2,money,c1,c2){
  if(m?.format==='BO5')return{available:false,reason:'One-set model is calibrated for BO3.'};
  const {p1,p2}=matchPlayers(m);if(money.p1Probability==null)return{available:false,reason:'Not enough data.'};
  const side=money.p1Probability<.5?1:2,target=side===1?p1:p2,s=side===1?s1:s2,c=side===1?c1:c2;
  const matchProb=side===1?money.p1Probability:1-money.p1Probability;
  const setMath=setProbFromMatchProb(matchProb);
  const careerSurf=archiveSurfacePct(c,m.surface),serve=serveQuality(c);
  const parts=[
    {name:'Surface set-taking',w:40,p:s.setSurface.p},
    {name:'Recent set-taking',w:25,p:s.setRecent.p},
    {name:'Match-strength transform',w:20,p:setMath},
    {name:'Career surface',w:10,p:careerSurf},
    {name:'Serve quality',w:5,p:serve}
  ];
  const model=weighted(parts),prob=model.p;
  if(prob==null)return{available:false,reason:'Not enough BO3 set history.'};
  let classification='SKIP';
  if(model.coverage>=75&&prob>=.80)classification='STRONG';
  else if(model.coverage>=60&&prob>=.72)classification='PLAY';
  else if(prob>=.65)classification='WATCH';
  return{available:true,player:target.name,prob,coverage:model.coverage,classification,parts}
}
function pct(v){return v==null?'N/A':(100*v).toFixed(1)+'%'}
function fairOdds(p){return p&&p>0?(1/p).toFixed(2):'N/A'}
function summaryCard(p,career,moneySide){
  const s=p.summary,cs=archiveSurfacePct(career,p.currentSurface),sq=serveQuality(career);
  return `<div class="panel"><b>${esc(p.name)}</b><div class="stats">
    <div class="stat"><b>${p.ranking??'NR'}</b><span>Current rank</span></div>
    <div class="stat"><b>${s.recent.wins}-${s.recent.losses}</b><span>Recent W-L (${s.recent.n})</span></div>
    <div class="stat"><b>${pct(s.surface.p)}</b><span>Recent surface</span></div>
    <div class="stat"><b>${pct(cs)}</b><span>Archive career surface</span></div>
    <div class="stat"><b>${pct(sq)}</b><span>Archive serve quality</span></div>
    <div class="stat"><b>${pct(s.setSurface.p)}</b><span>Won ≥1 set on surface</span></div>
    <div class="stat"><b>${s.workload.last3}/${s.workload.last7}</b><span>Matches last 3d / 7d</span></div>
  </div></div>`
}
function render(){
  const b=$('matches'),min=+$('min').value;
  if(!matches.length){b.innerHTML='<div class="small">No upcoming singles found in this window.</div>';return}
  b.innerHTML=matches.map((m,i)=>{
    const {p1,p2}=matchPlayers(m),base=baseline(m),t=tag(base,min);
    return `<div class="match"><div class="badge ${t[1]}">${t[0]}</div>
      <div class="name">${esc(p1.name)} vs ${esc(p2.name)}</div>
      <div class="meta">${wat(m.scheduled_time)} WAT • ${esc(m.tournament||'')} • ${esc(m.tier||m.tour||'')} • ${esc(m.surface||'?')} • ${esc(m.format||'?')}<br>
      Rank ${p1.ranking??'NR'} vs ${p2.ranking??'NR'} • shortlist baseline ${Math.round(base)}/100</div>
      <div class="row"><button data-i="${i}" class="deep">DEEP ANALYZE</button></div></div>`
  }).join('');
  b.querySelectorAll('.deep').forEach(x=>x.onclick=()=>analyze(+x.dataset.i))
}
async function analyze(i){
  const full=matches[i],box=$('analysis'),{p1,p2}=matchPlayers(full);
  box.style.display='block';box.innerHTML='<div class="status">Running BASIC-max analysis…</div>';box.scrollIntoView({behavior:'smooth'});
  try{
    if(!p1.id||!p2.id)throw Error('This fixture does not have stable player IDs yet.');

    // 5 analysis calls total: two recent histories, H2H, and two archive-career summaries.
    // Career calls are soft: if a modern player has no pre-2023 archive career, the model simply lowers coverage.
    const [h1,h2,hh,c1,c2]=await Promise.all([
      api(`/history/matches?player=${encodeURIComponent(p1.id)}&draw=singles&limit=50`),
      api(`/history/matches?player=${encodeURIComponent(p2.id)}&draw=singles&limit=50`),
      api(`/h2h?p1=${encodeURIComponent(p1.name)}&p2=${encodeURIComponent(p2.name)}`),
      api(`/history/archive/career?name=${encodeURIComponent(p1.name)}`,true),
      api(`/history/archive/career?name=${encodeURIComponent(p2.name)}`,true)
    ]);

    const s1=historySummary(h1.data||[],p1.id,full.surface,full.scheduled_time);
    const s2=historySummary(h2.data||[],p2.id,full.surface,full.scheduled_time);
    const h2h=h2hInfo(hh,full.surface);
    const money=analyzeMoneyline(full,s1,s2,h2h,c1,c2);
    const oneSet=analyzeOneSet(full,s1,s2,money,c1,c2);

    const pp1={...p1,summary:s1,currentSurface:full.surface},pp2={...p2,summary:s2,currentSurface:full.surface};
    const mRows=money.parts.filter(x=>x.p!=null).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.w}%</td><td>${pct(x.p)}</td></tr>`).join('');
    let setHtml='';
    if(oneSet.available){
      const sRows=oneSet.parts.filter(x=>x.p!=null).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.w}%</td><td>${pct(x.p)}</td></tr>`).join('');
      setHtml=`<div class="panel"><div class="section-title">2. Win At Least One Set</div>
        <div class="result">${esc(oneSet.player)} — ${esc(oneSet.classification)}</div>
        <div class="bigprob">${pct(oneSet.prob)}</div>
        <div class="fair">Model fair odds: <span>${fairOdds(oneSet.prob)}</span></div>
        <div class="small">Coverage ${Math.round(oneSet.coverage)}%</div>
        <table><tr><th>Component</th><th>Weight</th><th>Probability</th></tr>${sRows}</table>
      </div>`;
    }else setHtml=`<div class="panel"><div class="section-title">2. Win At Least One Set</div><div class="bad">${esc(oneSet.reason)}</div></div>`;

    box.innerHTML=`<div class="small">LiveTennisAPI BASIC-max • ${esc(full.surface||'?')} • ${esc(full.format||'?')} • 5 analysis requests</div>
      <div class="two" style="margin-top:10px">${summaryCard(pp1,c1)}${summaryCard(pp2,c2)}</div>
      <div class="two" style="margin-top:10px">
        <div class="panel"><div class="section-title">1. Match Moneyline</div>
          <div class="result">${esc(money.winner||'NO PICK')} — ${esc(money.classification)}</div>
          <div class="bigprob">${pct(money.prob)}</div>
          <div class="fair">Model fair odds: <span>${fairOdds(money.prob)}</span></div>
          <div class="small">Coverage ${Math.round(money.coverage)}%</div>
          <table><tr><th>Component</th><th>Weight</th><th>P1 lean</th></tr>${mRows}</table>
        </div>
        ${setHtml}
      </div>
      <div class="notice">H2H ${h2h.p1Wins}-${h2h.p2Wins} (${h2h.n} decided). BASIC archive career and serve aggregates are used only when they exist; newer players are not penalized for missing pre-2023 archive data. No extra point-tape calls are made, saving quota.</div>`;
  }catch(e){
    box.innerHTML=`<div class="bad">Analysis failed: ${esc(e.message)}</div><div class="small">Check the Basic key and history entitlement.</div>`
  }
}
$('scan').onclick=async()=>{
  const key=$('key').value.trim();if(!key){$('status').innerHTML='<span class="bad">Paste API key.</span>';return}
  $('scan').disabled=true;$('status').textContent='Scanning…';
  try{
    let all=[];const pages=+$('pages').value;
    for(let i=0;i<pages;i++){
      const d=await api(`/matches?status=upcoming&draw=singles&limit=100&offset=${i*100}`);
      all.push(...(d.data||[]));if(!d.meta?.has_more)break
    }
    const now=Date.now(),end=now+(+$('hours').value)*3600000;
    matches=all.filter(m=>{const t=Date.parse(m.scheduled_time||'');return Number.isFinite(t)&&t>now&&t<=end})
      .sort((a,b)=>baseline(b)-baseline(a)||Date.parse(a.scheduled_time)-Date.parse(b.scheduled_time)).slice(0,10);
    render();$('status').innerHTML=`<span class="good">Done.</span> ${all.length} loaded • showing best ${matches.length}.`;
  }catch(e){$('status').innerHTML='<span class="bad">'+esc(e.message)+'</span>'}
  finally{$('scan').disabled=false}
};
})();
</script>
</body>
</html>
